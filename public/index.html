<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Telegram 定时签到任务控制台" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TG 签到台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b0d10'/%3E%3Cpath d='M7 12.4l3.2 3.2L17 8.8' fill='none' stroke='%235cc8bd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view-root">跳到主要内容</a>

    <!-- 首屏加载占位 -->
    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="brand boot-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
            <path d="M8.4 12.4l2.6 2.6 4.6-5.2" />
          </svg>
        </span>
        <span class="brand-name">TG 签到台</span>
      </div>
      <div class="boot-lines" aria-hidden="true">
        <span class="skeleton" style="width: 42%"></span>
        <span class="skeleton" style="width: 68%"></span>
        <span class="skeleton" style="width: 54%"></span>
      </div>
      <p class="boot-text">正在读取服务端状态…</p>
    </div>

    <!-- 登录 -->
    <section id="login-view" class="login" aria-labelledby="login-title" hidden>
      <div class="login-card">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
              <path d="M8.4 12.4l2.6 2.6 4.6-5.2" />
            </svg>
          </span>
          <span class="brand-name">TG 签到台</span>
        </div>

        <h1 class="login-title" id="login-title">管理员登录</h1>
        <p class="login-desc">输入 Cloudflare 里配置的 ADMIN_PASSWORD 进入控制台。</p>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label class="field-label" for="login-password">管理密码</label>
            <input
              class="input"
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="密码"
              required
            />
          </div>
          <div class="turnstile-slot" id="turnstile-slot" hidden></div>
          <button class="btn btn-primary btn-block" type="submit" id="login-submit">登录</button>
          <p class="form-error" id="login-error" role="alert" hidden></p>
        </form>

        <p class="login-build" id="login-build" hidden></p>

        <div class="banner banner-warn" id="login-setup" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4.5l8.5 15h-17z" />
            <path d="M12 10v4.2" />
            <path d="M12 17.3v.01" />
          </svg>
          <div class="banner-text">
            <strong>服务端还没有配置管理员密码。</strong>
            <p>
              在 Cloudflare 控制台把
              <code class="code">ADMIN_PASSWORD</code>
              设为 Worker 的 secret（或写进
              <code class="code">.dev.vars</code>
              用于本地开发），然后刷新页面。
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- 主界面 -->
    <div id="app-view" hidden>
      <header class="topbar">
        <a class="brand" href="#/overview">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
              <path d="M8.4 12.4l2.6 2.6 4.6-5.2" />
            </svg>
          </span>
          <span class="brand-name">TG 签到台</span>
        </a>

        <div class="topbar-right">
          <button class="account-chip" id="account-chip" type="button">
            <span class="dot idle"></span>
            <span>未登录 TG</span>
          </button>
          <span class="clock" id="clock" title="已按服务端时间校正">--:--:--</span>
          <button class="btn btn-ghost btn-sm" type="button" id="logout-btn">退出</button>
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="主导航">
        <a class="tab" href="#/overview" data-view="overview">概览</a>
        <a class="tab" href="#/tasks" data-view="tasks">任务</a>
        <a class="tab" href="#/logs" data-view="logs">日志</a>
        <a class="tab" href="#/account" data-view="account">账号</a>
        <a class="tab" href="#/settings" data-view="settings">设置</a>
      </nav>

      <main class="main" id="main">
        <div id="view-root" tabindex="-1"></div>
      </main>

      <footer class="app-footer">
        <span class="footer-version" id="footer-version">版本读取中…</span>
        <span class="footer-dot" aria-hidden="true">·</span>
        <a class="footer-link" href="https://github.com/mihucho/cf-tg-checkin" target="_blank" rel="noopener noreferrer">
          cf-tg-checkin
        </a>
      </footer>
    </div>

    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-relevant="additions text"></div>

    <div id="overlay" class="overlay" hidden>
      <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></div>
    </div>

    <noscript>
      <div class="noscript">这个管理界面需要启用 JavaScript。</div>
    </noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
