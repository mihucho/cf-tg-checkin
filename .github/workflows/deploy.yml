name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 「Deploy to Cloudflare」按钮会通过 repository_dispatch 触发本工作流
  repository_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build bundle
        run: node build.mjs
      - name: 检查产物里导出 Durable Object 类
        run: npm run check:bundle

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs && npm run check:bundle
      - name: 检查是否配置了 Cloudflare 凭据
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过部署（fork 仓库属于正常情况）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # 首次部署后仍需要设置 ADMIN_PASSWORD，见 docs/DEPLOY.md
